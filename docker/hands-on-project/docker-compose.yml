version: "3.8"

services:
  app1:
    build: ./app
    environment:
      - INSTANCE_NAME=app1
      - PORT=3000
    networks:
      - appnet

  app2:
    build: ./app
    environment:
      - INSTANCE_NAME=app2
      - PORT=3000
    networks:
      - appnet

  app3:
    build: ./app
    environment:
      - INSTANCE_NAME=app3
      - PORT=3000
    networks:
      - appnet

  proxy:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
